# 大模型配置（对话模型 + 向量模型）
# 通过 application.yml 的 spring.config.import 引入。
# 新增模型：在 chat / embedding 列表下复制一条即可，无需改动任何 Java 代码。
# 注意：base-url 不要带 /v1 后缀，OpenAiApi 会自动追加 /v1/chat/completions 或 /v1/embeddings。
app:
  models:
    # 对话模型（统一走 OpenAI 兼容协议，靠 base-url / api-key / model 区分）
    chat:
      - name: deepseek
        base-url: https://api.deepseek.com
        api-key: ${DEEPSEEK_API_KEY}
        model: deepseek-chat
        temperature: 0.7
        max-tokens: 4096
      - name: kimi
        base-url: https://api.moonshot.cn
        api-key: ${KIMI_API_KEY}
        model: kimi-k3
        temperature: 1.0
    # 向量（Embedding）模型
    embedding:
      - name: bge-m3
        base-url: https://api.siliconflow.cn
        api-key: ${SILICONFLOW_API_KEY}
        model: BAAI/bge-m3
